# Adding a model is a pull request with an approval. That is the governance
# story told in a form engineers will actually follow.
#
# This one exists for the docs/baseline.md measurement, not for daily work.
# Weight-load time dominates time-to-ready, so baselining on the 0.5B fixture
# would produce a real number that teaches you nothing about whether the
# node-local weights cache (ADR-0004) is worth having. Run this once, record
# the cold and warm timings, then go back to the 0.5B.
id: qwen2.5-7b-instruct
mode: self_hosted
default_lane: b
model_ref: Qwen/Qwen2.5-7B-Instruct
accelerator: l4
gpu_count: 1
context_length: 32768
quantization: null
license: apache-2.0          # verified before status: validated
status: preview
engine_args:
  dtype: bfloat16               # never leave this to auto -- see below
  max-model-len: 32768
  gpu-memory-utilization: 0.90

# weights_uri is deliberately unset, so vLLM fetches model_ref from
# HuggingFace itself. That is one fewer moving part for a first run on real
# hardware -- the node-local cache from ADR-0004 needs a fetcher image that
# does not exist yet, and every deployment would ImagePullBackOff.
#
# Setting weights_uri later switches this entry to the mounted-cache path
# without changing what it identifies. That separation is why model_ref
# exists (migration 0006).

# dtype is explicit on purpose. vLLM does NOT fail on an unsupported dtype:
# on a T4 (compute 7.5, no bfloat16) it logs
#   WARNING Casting torch.bfloat16 to torch.float16
# and carries on. That is a silent numerics change, not an error -- so in a
# fleet with mixed accelerators, 'auto' means the same model runs at
# different precision on different nodes with nothing to show for it.
# Verified against vLLM 0.28.0; see bench/colab/results-2026-09-01.json.
